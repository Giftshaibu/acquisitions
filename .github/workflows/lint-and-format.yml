name: Lint and Format

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]

permissions:
  contents: read

jobs:
  quality:
    name: ESLint and Prettier
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        id: lint
        continue-on-error: true
        run: npm run lint

      - name: Run Prettier check
        id: format
        continue-on-error: true
        run: npm run format:check

      - name: Report quality failures
        if: steps.lint.outcome == 'failure' || steps.format.outcome == 'failure'
        env:
          LINT_OUTCOME: ${{ steps.lint.outcome }}
          FORMAT_OUTCOME: ${{ steps.format.outcome }}
        run: |
          if [ "$LINT_OUTCOME" = "failure" ]; then
            echo "::error title=ESLint failed::Run 'npm run lint:fix' locally, review the changes, and commit the fixes."
          fi
          if [ "$FORMAT_OUTCOME" = "failure" ]; then
            echo "::error title=Prettier check failed::Run 'npm run format' locally and commit the formatted files."
          fi
          exit 1
