name: Tests

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]

permissions:
  contents: read

jobs:
  test:
    name: Jest tests
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
      NODE_OPTIONS: --experimental-vm-modules
      DATABASE_URL: postgresql://test:test@localhost:5432/acquisitions_test

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        id: tests
        continue-on-error: true
        run: npm test

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ github.sha }}
          path: coverage/
          retention-days: 30
          if-no-files-found: warn

      - name: Write test summary
        if: always()
        env:
          TEST_OUTCOME: ${{ steps.tests.outcome }}
        run: |
          echo "## Test and coverage report" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [ "$TEST_OUTCOME" = "success" ]; then
            echo "✅ Jest tests passed." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "❌ Jest tests failed. Review the test log for details." >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -d coverage ]; then
            echo "Coverage was generated and uploaded as the \`coverage-${GITHUB_SHA}\` artifact (retained for 30 days)." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No coverage report was generated." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Report test failure
        if: steps.tests.outcome == 'failure'
        run: |
          echo "::error title=Tests failed::One or more Jest tests failed. Run 'npm test' locally and review the failing test output."
          exit 1
